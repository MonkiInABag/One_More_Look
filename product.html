<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product | One More Look</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="main-nav" id="siteNav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="index.html#shop">Shop</a>
        <a href="index.html#new-in">New In</a>
        <a href="about.html">About</a>
        <a href="how-it-works.html#how-it-works">How It Works</a>
        <a href="contact.html">Contact</a>
      </nav>
      <a class="top-logo" href="index.html" aria-label="One More Look home">
        <img src="assets/top-logo-transparent.png" alt="One More Look" />
      </a>
      <div class="header-actions">
        <button class="menu-button" id="menuToggle" type="button" aria-expanded="false" aria-controls="siteNav">
          Menu
        </button>
        <button class="basket-button" id="basketOpen" type="button" aria-label="Open basket">
          <span class="bag-icon" aria-hidden="true">Bag</span>
          <span id="basketCount">0</span>
        </button>
        <a class="sell-button" href="how-it-works.html#sell-with-us">Sell With Us</a>
      </div>
    </header>

    <main class="product-page">
      <section class="product-detail" id="productDetail"></section>
    </main>

    <footer class="site-footer">
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="terms-and-conditions.html">Terms &amp; Conditions</a>
        <a href="how-it-works.html#sell-with-us">Sell To Us</a>
      </nav>
      <div class="footer-socials" aria-label="Social links">
        <a href="#" aria-label="Instagram">IG</a>
        <a href="#" aria-label="Facebook">f</a>
        <a href="#" aria-label="TikTok">TikTok</a>
        <a href="#" aria-label="X">X</a>
      </div>
      <p class="footer-copyright">
        &copy; All site contents copyright 2026, One More Look. All trademarks acknowledged.
      </p>
    </footer>

    <dialog class="basket-panel" id="basketPanel">
      <div class="panel-top">
        <div>
          <p class="eyebrow">Your bag</p>
          <h2>Ready to buy</h2>
        </div>
        <button class="icon-button" id="basketClose" type="button" aria-label="Close basket">
          <span aria-hidden="true">x</span>
        </button>
      </div>
      <div class="basket-list" id="basketList"></div>
      <div class="basket-footer">
        <div class="summary-line">
          <span>Subtotal</span>
          <strong id="basketSubtotal">GBP 0</strong>
        </div>
        <a class="button primary" id="checkoutLink" href="index.html#checkout">Go to checkout</a>
        <button class="button secondary" id="clearBasket" type="button">Clear bag</button>
      </div>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
